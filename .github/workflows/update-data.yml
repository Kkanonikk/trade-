name: update-data
# Раз в неделю скачивает свежие данные из первоисточников и открывает pull request со снимком.
# Запуск вручную: вкладка Actions -> update-data -> Run workflow.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Обновить снимки
        run: |
          python scripts/update_snapshot.py
          python scripts/update_global_snapshot.py
      - name: Проверить, что приложение читает данные
        run: python -m pytest -q tests/test_worldmode.py -x
      - name: Открыть pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then echo "Данные не изменились"; exit 0; fi
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          branch="data-update-$(date +%Y%m%d)"
          git checkout -b "$branch"
          git add assets
          git commit -m "Обновление снимка данных $(date +%Y-%m-%d)"
          git push -u origin "$branch"
          gh pr create --title "Обновление данных $(date +%Y-%m-%d)" --body "Автоматическое обновление снимка из первоисточников. Проверь изменения в assets/snapshot/manifest.json."
